<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="refresh" content="0; url=/snapshot">
  <link rel="canonical" href="/snapshot">
  <title>Opening Bridge To AI Snapshot…</title>
  <style>
    :root {
      --canvas: #fcfbf9;
      --ink: #172c38;
      --teal: #075f53;
      --teal-deep: #06483f;
      --gold: #e3a63c;
      --gold-hover: #d2942b;
      --line: #d9e7e3;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    a:focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 3px;
    }
    .banner {
      padding: 0.75rem 1rem;
      background: var(--teal-deep);
      color: #fff;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
    }
    main {
      width: min(100% - 2.5rem, 700px);
      margin: 0 auto;
      padding: 4rem 0;
    }
    .eyebrow {
      margin: 0 0 0.65rem;
      color: var(--teal);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 13ch;
      margin: 0;
      color: var(--teal-deep);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.15rem, 6vw, 3.5rem);
      line-height: 1.08;
    }
    .lead {
      max-width: 58ch;
      margin: 1.35rem 0 0;
      font-size: 1.1rem;
    }
    .steps {
      display: grid;
      gap: 0.85rem;
      margin: 2.5rem 0;
      padding: 0;
      list-style: none;
      counter-reset: test-step;
    }
    .steps li {
      position: relative;
      padding: 1rem 1rem 1rem 4rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      counter-increment: test-step;
    }
    .steps li::before {
      position: absolute;
      top: 1rem;
      left: 1rem;
      display: grid;
      width: 2.15rem;
      height: 2.15rem;
      place-items: center;
      border-radius: 50%;
      background: #e8f4f1;
      color: var(--teal);
      font-weight: 800;
      content: counter(test-step);
    }
    .steps strong { display: block; color: var(--teal-deep); }
    .cta {
      display: inline-block;
      padding: 1rem 1.4rem;
      border-radius: 8px;
      background: var(--gold);
      color: #172c38;
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
    }
    .cta:hover { background: var(--gold-hover); }
    .fine-print {
      margin-top: 0.8rem;
      color: #50615f;
      font-size: 0.88rem;
    }
    .feedback {
      margin-top: 3.5rem;
      padding: 1.5rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f5faf8;
    }
    .feedback h2 { margin: 0; color: var(--teal-deep); font-size: 1.25rem; }
    .feedback p { margin: 0.65rem 0; }
    .feedback ul { margin: 0.8rem 0 0; padding-left: 1.25rem; }
    @media (max-width: 480px) {
      main { width: min(100% - 2rem, 700px); padding: 2.75rem 0; }
      .cta { display: block; text-align: center; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Bridge To AI · private test</p>
    <h1>Opening your AI Opportunity Snapshot…</h1>
    <p class="lead">You are being taken to the short private Snapshot. Please use sample or non-sensitive business information only.</p>
    <p><a class="cta" href="/snapshot">Continue to the short Snapshot</a></p>
  </main>
</body>
</html>
